{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  <section class="post-list">
    {{ range .Pages }}
    {{ partial "post-item.html" . }}
    {{ else }}
    <p class="no-posts">No posts yet.</p>
    {{ end }}
  </section>
</div>
{{ end }}
