{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">Posts</h1>
  </header>
  <section class="post-list">
    {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
    {{ partial "post-item.html" . }}
    {{ else }}
    <p class="no-posts">No posts yet.</p>
    {{ end }}
  </section>
</div>
{{ end }}
